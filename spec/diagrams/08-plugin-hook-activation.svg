<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>text{font-family:Arial,sans-serif;fill:#182230}.t{font-size:30px;font-weight:bold}.h{font-size:21px;font-weight:bold}.b{font-size:17px}.box{stroke:#385c8a;stroke-width:3;rx:18}.arrow{stroke:#516f94;stroke-width:4;fill:none;marker-end:url(#a)}</style>
