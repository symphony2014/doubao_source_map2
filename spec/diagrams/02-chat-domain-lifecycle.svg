<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="Chat domain lifecycle diagram">
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#536177}.box{fill:#fff4e8;stroke:#c46b1c;stroke-width:2}.state{fill:#f5efff;stroke:#7250b5;stroke-width:2}.line{stroke:#60728c;stroke-width:2;marker-end:url(#a)}.label{font-size:17px;font-weight:600}.small{font-size:13px;fill:#536177}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#60728c"/></marker></defs>
<text x="34" y="42" class="title">2. Chat Domain &amp; Lifecycle</text><text x="34" y="68" class="sub">Optimistic local drafts become streamed server messages</text>
<rect x="35" y="210" width="135" height="70" rx="12" class="box"/><text x="58" y="242" class="label">Draft</text><text x="51" y="265" class="small">local_message_id</text>
<rect x="225" y="210" width="135" height="70" rx="12" class="box"/><text x="252" y="242" class="label">ACK</text><text x="237" y="265" class="small">remote IDs</text>
<rect x="415" y="210" width="135" height="70" rx="12" class="state"/><text x="433" y="242" class="label">Streaming</text><text x="434" y="265" class="small">CMPL chunks</text>
<rect x="605" y="210" width="120" height="70" rx="12" class="state"/><text x="622" y="242" class="label">Finished</text><text x="632" y="265" class="small">FIN / ERR</text>
<line x1="170" y1="245" x2="223" y2="245" class="line"/><line x1="360" y1="245" x2="413" y2="245" class="line"/><line x1="550" y1="245" x2="603" y2="245" class="line"/>
<rect x="180" y="355" width="400" height="90" rx="12" class="box"/><text x="275" y="388" class="label">MessageTransformer + LifecycleHandler</text><text x="222" y="414" class="small">normalizes wire payloads · rejects stale chunks · updates stores</text>
<line x1="480" y1="282" x2="450" y2="352" class="line"/>
</svg>
