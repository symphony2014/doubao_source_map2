<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="Runtime IoC and stores diagram">
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#536177}.box{fill:#eef4ff;stroke:#3868b7;stroke-width:2}.store{fill:#ecfbf2;stroke:#27815b;stroke-width:2}.line{stroke:#60728c;stroke-width:2;marker-end:url(#a)}.label{font-size:17px;font-weight:600}.small{font-size:13px;fill:#536177}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#60728c"/></marker></defs>
