<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="SSE protocol and asynchronous tasks diagram">
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#536177}.box{fill:#fff0f3;stroke:#ba4164;stroke-width:2}.line{stroke:#60728c;stroke-width:2;marker-end:url(#a)}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#536177}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#60728c"/></marker></defs>
<text x="34" y="42" class="title">4. SSE Protocol &amp; Async Tasks</text><text x="34" y="68" class="sub">Ordered server-sent events update a resumable local task</text>
<rect x="32" y="180" width="130" height="85" rx="12" class="box"/><text x="48" y="214" class="label">sendMessage</text><text x="48" y="238" class="small">POST request</text>
<rect x="220" y="180" width="145" height="85" rx="12" class="box"/><text x="243" y="214" class="label">SSE client</text><text x="238" y="238" class="small">completion API</text>
<rect x="423" y="180" width="145" height="85" rx="12" class="box"/><text x="441" y="214" class="label">Serial queue</text><text x="445" y="238" class="small">preserve order</text>
<rect x="626" y="180" width="105" height="85" rx="12" class="box"/><text x="640" y="214" class="label">Store</text><text x="641" y="238" class="small">task state</text>
<line x1="162" y1="222" x2="218" y2="222" class="line"/><line x1="365" y1="222" x2="421" y2="222" class="line"/><line x1="568" y1="222" x2="624" y2="222" class="line"/>
<rect x="80" y="340" width="600" height="90" rx="12" class="box"/><text x="126" y="374" class="label">ACK → CMPL / VERBOSE → FIN or ERR</text><text x="126" y="402" class="small">checkpoint event ID · retry with heartbeat timeout · create / resume async task</text>
<line x1="480" y1="267" x2="430" y2="337" class="line"/>
</svg>
