<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="Rendering and artifacts diagram">
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#536177}.box{fill:#f2f0ff;stroke:#6955ad;stroke-width:2}.line{stroke:#60728c;stroke-width:2;marker-end:url(#a)}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#536177}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#60728c"/></marker></defs>
<text x="34" y="42" class="title">5. Rendering &amp; Artifacts</text><text x="34" y="68" class="sub">A normalized message is split into independently renderable regions</text>
<rect x="286" y="100" width="190" height="65" rx="12" class="box"/><text x="310" y="139" class="label">Normalized message</text>
<rect x="36" y="250" width="140" height="82" rx="12" class="box"/><text x="58" y="283" class="label">Thinking</text><text x="49" y="307" class="small">reasoning UI</text>
<rect x="218" y="250" width="140" height="82" rx="12" class="box"/><text x="244" y="283" class="label">Text / MD</text><text x="239" y="307" class="small">code blocks</text>
<rect x="400" y="250" width="140" height="82" rx="12" class="box"/><text x="417" y="283" class="label">Attachments</text><text x="423" y="307" class="small">files/media</text>
<rect x="582" y="250" width="140" height="82" rx="12" class="box"/><text x="600" y="283" class="label">Artifacts</text><text x="602" y="307" class="small">skill cards</text>
<line x1="340" y1="165" x2="110" y2="247" class="line"/><line x1="360" y1="165" x2="288" y2="247" class="line"/><line x1="402" y1="165" x2="470" y2="247" class="line"/><line x1="428" y1="165" x2="650" y2="247" class="line"/>
<text x="52" y="414" class="small">URLs are validated/sanitized at the image, link, and window-open rendering boundary.</text>
